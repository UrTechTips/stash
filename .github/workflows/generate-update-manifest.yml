name: Generate Android Update Manifest

on:
  release:
    types: [published]

  workflow_call:
    inputs:
      tag:
        description: "Release tag, for example v1.0.1"
        required: true
        type: string

  # Also allows processing an existing release manually.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate-manifest:
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;35.0.0'

      - name: Download universal APK from release
        run: |
          set -euo pipefail
          mkdir -p release-assets

          APK_NAME="stash-${RELEASE_TAG}-universal.apk"

          # Retry: the asset may not be attached yet when the release event fires.
          for i in 1 2 3 4 5 6; do
            if gh release download "$RELEASE_TAG" \
                 --repo "$REPOSITORY" \
                 --pattern "$APK_NAME" \
                 --dir release-assets; then
              break
            fi
            if [ "$i" -eq 6 ]; then
              echo "::error::$APK_NAME not found on release $RELEASE_TAG after retries"
              exit 1
            fi
            echo "Asset not available yet (attempt $i/6), retrying in 20s..."
            sleep 20
          done

          APK_PATH="release-assets/$APK_NAME"
          test -s "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Generate update.json
        run: |
          set -euo pipefail

          APK_NAME="$(basename "$APK_PATH")"

          APK_VERSION="$(apkanalyzer manifest version-name "$APK_PATH" | tr -d '\r\n')"
          APK_VERSION_CODE="$(apkanalyzer manifest version-code "$APK_PATH" | tr -d '\r\n')"
          PACKAGE_NAME="$(apkanalyzer manifest application-id "$APK_PATH" | tr -d '\r\n')"

          EXPECTED_VERSION="${RELEASE_TAG#v}"

          if [ "$APK_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Release tag expects $EXPECTED_VERSION, but APK version is $APK_VERSION"
            exit 1
          fi

          if ! [[ "$APK_VERSION_CODE" =~ ^[0-9]+$ ]] || [ "$APK_VERSION_CODE" -lt 1 ]; then
            echo "::error::APK contains an invalid Android versionCode"
            exit 1
          fi

          APK_SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          APK_SIZE="$(stat -c %s "$APK_PATH")"

          # Signing certificate fingerprint (lets the app verify the signer too).
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          # Capture the full output first so failures are debuggable and
          # nothing in the pipeline can trip pipefail/SIGPIPE.
          if ! SIGNER_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH" 2>&1)"; then
            echo "$SIGNER_OUTPUT"
            echo "::error::apksigner could not verify the APK signature"
            exit 1
          fi
          echo "---- apksigner output ----"
          echo "$SIGNER_OUTPUT"
          echo "--------------------------"

          CERT_SHA256="$(printf '%s\n' "$SIGNER_OUTPUT" \
            | awk '/certificate SHA-256 digest/ && !found { sub(/.*digest: */, ""); print; found = 1 }' \
            | tr -d '\r\n ')"
          if [ -z "$CERT_SHA256" ]; then
            echo "::error::apksigner ran, but no 'certificate SHA-256 digest' line was found (see output above)"
            exit 1
          fi

          RELEASE_INFO="$(gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG")"
          RELEASE_URL="$(printf '%s' "$RELEASE_INFO" | jq -r '.html_url')"
          RELEASE_NOTES="$(printf '%s' "$RELEASE_INFO" | jq -r '.body // ""')"
          DOWNLOAD_URL="$(printf '%s' "$RELEASE_INFO" | jq -r --arg name "$APK_NAME" \
            '.assets[] | select(.name == $name) | .browser_download_url')"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::Could not resolve download URL for $APK_NAME"
            exit 1
          fi

          jq -n \
            --arg version "$APK_VERSION" \
            --argjson versionCode "$APK_VERSION_CODE" \
            --arg packageName "$PACKAGE_NAME" \
            --arg releaseTag "$RELEASE_TAG" \
            --arg apkAssetName "$APK_NAME" \
            --arg downloadUrl "$DOWNLOAD_URL" \
            --argjson apkSize "$APK_SIZE" \
            --arg sha256 "$APK_SHA256" \
            --arg signingCertSha256 "$CERT_SHA256" \
            --arg releaseUrl "$RELEASE_URL" \
            --arg releaseNotes "$RELEASE_NOTES" \
            '{
              schemaVersion: 1,
              version: $version,
              versionCode: $versionCode,
              packageName: $packageName,
              releaseTag: $releaseTag,
              apkAssetName: $apkAssetName,
              downloadUrl: $downloadUrl,
              apkSize: $apkSize,
              sha256: $sha256,
              signingCertSha256: $signingCertSha256,
              releaseUrl: $releaseUrl,
              releaseNotes: $releaseNotes
            }' > update.json

          cat update.json

      - name: Upload update.json to GitHub Release
        run: |
          gh release upload "$RELEASE_TAG" update.json \
            --repo "$REPOSITORY" \
            --clobber
