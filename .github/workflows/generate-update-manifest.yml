name: Generate Android Update Manifest

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "Release tag, for example v1.0.1"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate-manifest:
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
      # Every ABI that must be attached to the release. Edit this if you drop one.
      REQUIRED_ABIS: "arm64-v8a armeabi-v7a x86_64 x86 universal"

    steps:
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;35.0.0'

      - name: Download all APKs from release
        run: |
          set -euo pipefail
          mkdir -p release-assets

          EXPECTED_COUNT="$(wc -w <<< "$REQUIRED_ABIS" | tr -d ' ')"

          # Retry until the whole set is attached, not just the first APK.
          for i in 1 2 3 4 5 6; do
            gh release download "$RELEASE_TAG" \
              --repo "$REPOSITORY" \
              --pattern "*.apk" \
              --dir release-assets \
              --clobber || true

            FOUND="$(find release-assets -name '*.apk' | wc -l | tr -d ' ')"
            if [ "$FOUND" -ge "$EXPECTED_COUNT" ]; then
              break
            fi
            if [ "$i" -eq 6 ]; then
              echo "::error::Found $FOUND of $EXPECTED_COUNT APKs on release $RELEASE_TAG after retries"
              exit 1
            fi
            echo "Only $FOUND/$EXPECTED_COUNT APKs available (attempt $i/6), retrying in 20s..."
            sleep 20
          done

      - name: Generate update.json
        run: |
          set -euo pipefail

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi

          APK_ASSETS_JSON="{}"
          SHA256S_JSON="{}"
          BASE_VERSION=""
          BASE_CODE=""
          BASE_PACKAGE=""
          BASE_CERT=""

          for APK_PATH in release-assets/*.apk; do
            APK_NAME="$(basename "$APK_PATH")"

            # Work out the target ABI from the filename (x86_64 must be checked before x86)
            case "$APK_NAME" in
              *arm64-v8a*)   ABI="arm64-v8a" ;;
              *armeabi-v7a*) ABI="armeabi-v7a" ;;
              *x86_64*)      ABI="x86_64" ;;
              *x86*)         ABI="x86" ;;
              *universal*)   ABI="universal" ;;
              *)
                echo "::error::Can't tell which ABI $APK_NAME is for"
                exit 1
                ;;
            esac

            if jq -e --arg abi "$ABI" 'has($abi)' <<< "$APK_ASSETS_JSON" > /dev/null; then
              echo "::error::More than one APK for $ABI (latest: $APK_NAME)"
              exit 1
            fi

            VERSION="$(apkanalyzer manifest version-name "$APK_PATH" | tr -d '\r\n')"
            CODE="$(apkanalyzer manifest version-code "$APK_PATH" | tr -d '\r\n')"
            PACKAGE="$(apkanalyzer manifest application-id "$APK_PATH" | tr -d '\r\n')"

            # Every APK must verify and carry a real (non-debug) signature
            if ! SIGNER_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH" 2>&1)"; then
              echo "$SIGNER_OUTPUT"
              echo "::error::apksigner could not verify $APK_NAME"
              exit 1
            fi

            if grep -q 'CN=Android Debug' <<< "$SIGNER_OUTPUT"; then
              echo "::error::$APK_NAME is signed with the Android debug key"
              exit 1
            fi

            CERT="$(printf '%s\n' "$SIGNER_OUTPUT" \
              | awk '/certificate SHA-256 digest/ && !found { sub(/.*digest: */, ""); print; found = 1 }' \
              | tr -d '\r\n ')"

            if [ -z "$CERT" ]; then
              echo "::error::No 'certificate SHA-256 digest' line found for $APK_NAME"
              exit 1
            fi

            # All splits must agree on version, versionCode, package and signing cert
            if [ -z "$BASE_CODE" ]; then
              BASE_VERSION="$VERSION"
              BASE_CODE="$CODE"
              BASE_PACKAGE="$PACKAGE"
              BASE_CERT="$CERT"
            elif [ "$VERSION" != "$BASE_VERSION" ] || [ "$CODE" != "$BASE_CODE" ] \
              || [ "$PACKAGE" != "$BASE_PACKAGE" ] || [ "$CERT" != "$BASE_CERT" ]; then
              echo "::error::$APK_NAME differs from the other APKs (version, versionCode, package or signing cert)"
              exit 1
            fi

            APK_SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
            APK_ASSETS_JSON="$(jq --arg abi "$ABI" --arg name "$APK_NAME" '.[$abi] = $name' <<< "$APK_ASSETS_JSON")"
            SHA256S_JSON="$(jq --arg abi "$ABI" --arg sha "$APK_SHA256" '.[$abi] = $sha' <<< "$SHA256S_JSON")"
          done

          for REQUIRED in $REQUIRED_ABIS; do
            if ! jq -e --arg abi "$REQUIRED" 'has($abi)' <<< "$APK_ASSETS_JSON" > /dev/null; then
              echo "::error::Release $RELEASE_TAG has no APK for $REQUIRED"
              exit 1
            fi
          done

          EXPECTED_VERSION="${RELEASE_TAG#v}"
          if [ "$BASE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Release tag expects $EXPECTED_VERSION, but APK version is $BASE_VERSION"
            exit 1
          fi

          if ! [[ "$BASE_CODE" =~ ^[0-9]+$ ]] || [ "$BASE_CODE" -lt 1 ]; then
            echo "::error::APK contains an invalid Android versionCode"
            exit 1
          fi

          # Legacy fields for older updater builds: they only understand a single APK,
          # so point them at the universal one.
          UNIVERSAL_NAME="$(jq -r '.universal // empty' <<< "$APK_ASSETS_JSON")"
          UNIVERSAL_SHA="$(jq -r '.universal // empty' <<< "$SHA256S_JSON")"
          if [ -z "$UNIVERSAL_NAME" ] || [ -z "$UNIVERSAL_SHA" ]; then
            echo "::error::No universal APK on the release (older app versions need it)"
            exit 1
          fi

          RELEASE_INFO="$(gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG")"
          RELEASE_URL="$(printf '%s' "$RELEASE_INFO" | jq -r '.html_url')"
          RELEASE_NOTES="$(printf '%s' "$RELEASE_INFO" | jq -r '.body // ""')"

          jq -n \
            --arg version "$BASE_VERSION" \
            --argjson versionCode "$BASE_CODE" \
            --arg packageName "$BASE_PACKAGE" \
            --arg releaseTag "$RELEASE_TAG" \
            --argjson apkAssets "$APK_ASSETS_JSON" \
            --argjson sha256s "$SHA256S_JSON" \
            --arg apkAssetName "$UNIVERSAL_NAME" \
            --arg sha256 "$UNIVERSAL_SHA" \
            --arg signingCertSha256 "$BASE_CERT" \
            --arg releaseUrl "$RELEASE_URL" \
            --arg releaseNotes "$RELEASE_NOTES" \
            '{
              schemaVersion: 1,
              version: $version,
              versionCode: $versionCode,
              packageName: $packageName,
              releaseTag: $releaseTag,
              apkAssets: $apkAssets,
              sha256s: $sha256s,
              apkAssetName: $apkAssetName,
              sha256: $sha256,
              signingCertSha256: $signingCertSha256,
              releaseUrl: $releaseUrl,
              releaseNotes: $releaseNotes
            }' > update.json

          cat update.json

      - name: Upload update.json to GitHub Release
        run: |
          gh release upload "$RELEASE_TAG" update.json \
            --repo "$REPOSITORY" \
            --clobber